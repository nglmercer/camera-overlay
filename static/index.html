<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Overlay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #camera {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #camera.mirror-h { transform: scaleX(-1); }
        #camera.mirror-v { transform: scaleY(-1); }
    </style>
</head>
<body>
    <img id="camera" src="/stream" />
    <script>
        const params = new URLSearchParams(window.location.search);
        const img = document.getElementById('camera');
        if (params.has('mirror_h')) img.classList.add('mirror-h');
        if (params.has('mirror_v')) img.classList.add('mirror-v');
        window.addEventListener('beforeunload', () => { img.src = ''; });
    </script>
</body>
</html>
