<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Overlay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #camera {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        #camera.mirror-h { transform: scaleX(-1); }
        #camera.mirror-v { transform: scaleY(-1); }
    </style>
</head>
<body>
    <img id="camera" alt="" />
    <script>
        const params = new URLSearchParams(window.location.search);
        const img = document.getElementById('camera');
        if (params.has('mirror_h')) img.classList.add('mirror-h');
        if (params.has('mirror_v')) img.classList.add('mirror-v');

        let reconnectTimer = null;
        let streamGeneration = 0;

        function connectStream() {
            streamGeneration += 1;
            const gen = streamGeneration;
            // Only attach stream when we want live video; query cache-bust reconnects cleanly.
            img.style.display = 'block';
            img.src = `/stream?t=${Date.now()}`;
            img.onerror = () => {
                if (gen !== streamGeneration) return;
                scheduleReconnect();
            };
        }

        function scheduleReconnect() {
            if (reconnectTimer) return;
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                img.removeAttribute('src');
                connectStream();
            }, 1500);
        }

        async function ensureRunningThenConnect() {
            try {
                const r = await fetch('/status');
                if (r.ok) {
                    const s = await r.json();
                    if (!s.running) {
                        // Overlay stays transparent until camera is started from /config
                        img.style.display = 'none';
                        img.removeAttribute('src');
                        setTimeout(ensureRunningThenConnect, 2000);
                        return;
                    }
                }
            } catch (_) { /* fall through and try stream */ }
            connectStream();
        }

        window.addEventListener('beforeunload', () => {
            streamGeneration += 1;
            if (reconnectTimer) clearTimeout(reconnectTimer);
            img.removeAttribute('src');
        });

        ensureRunningThenConnect();
        // Re-check periodically so auto-start / config Start lights up OBS without reload
        setInterval(async () => {
            try {
                const r = await fetch('/status');
                if (!r.ok) return;
                const s = await r.json();
                if (s.running && !img.getAttribute('src')) {
                    connectStream();
                } else if (!s.running && img.getAttribute('src')) {
                    img.removeAttribute('src');
                    img.style.display = 'none';
                }
            } catch (_) {}
        }, 3000);
    </script>
</body>
</html>
